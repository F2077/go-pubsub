# golangci-lint configuration for go-pubsub.
#
# This file is intentionally short: go-pubsub is a small library and the
# goal is to catch genuine bugs and API drift, not to bikeshed style.
# `govet`, `ineffassign`, and `unused` are the conservative defaults;
# revive replaces the deprecated golint and adds community-standard rules
# (exported doc comments, error-strings, etc.); staticcheck is the
# long-time industry standard for Go static analysis.
#
# To run locally: `make lint` (or `golangci-lint run ./...` directly).
# To install: https://golangci-lint.run/welcome/install/

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet          # go vet, including shadow + copylocks
    - ineffassign    # unused assignments
    - unused         # unused identifiers (parameters, variables, types)
    - revive         # successor to golint; enforces exported doc comments
    - staticcheck    # SA-prefix rules: S1000, S1019, S1024, etc.

  # The maintainer prefers explicit type parameters in generic option
  # calls (e.g. NewBroker[string](), WithChannelSize[string](...)) even
  # when the compiler could in principle infer T. The reasoning:
  #
  #   1. the API surface reads uniformly across editors and tools
  #   2. type-arg-less chains like `NewBroker(WithLogger(logger))` are a
  #      known inference footgun: staticcheck's S1000 "unnecessary type
  #      arguments" rule has documented false positives there because
  #      T is genuinely unconstrained in some call shapes
  #   3. CLAUDE.md already records the explicit-type-args style as
  #      out-of-scope for unrelated work
  #
  # This exclusion silences that one rule project-wide; everything else
  # staticcheck reports is still enforced.
  exclusions:
    rules:
      - linters:
          - staticcheck
        text: "unnecessary type arguments"

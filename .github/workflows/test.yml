name: test

on:
  push:
    branches: [main, 'test/**']
  pull_request:
    branches: [main]

# Cancel an in-flight run of the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to the lowest supported version per go.mod (currently 1.25);
          # bump this whenever go.mod's `go` directive moves up.
          go-version: '1.25'
          cache: true

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Check gofmt
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))" \
            || (gofmt -d $(git ls-files '*.go'); exit 1)

      - name: Run go vet
        run: go vet ./...

      - name: Run race-enabled tests with coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v1.61.0 ships with Go 1.23 and refuses to lint modules whose
          # `go` directive is > 1.23 ("Go language version (go1.23) used
          # to build golangci-lint is lower than the targeted Go version
          # (1.25.0)"). v2.x is built with Go 1.24+, so it can parse our
          # go 1.25 module. v2 still accepts the v1-style config we have
          # (no `version: "2"` line, `linters.enable` + `exclusions.rules`
          # block); it just runs in compat mode and emits a deprecation
          # warning. golangci-lint-action v6 only accepts v1.x version
          # strings; v7 is required to dispatch v2.x binaries.
          # Bump this again whenever our `go` directive moves past the
          # version used to build the pin.
          version: v2.12.2
          only-new-issues: true

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

name: test

on:
  push:
    branches: [main, 'test/**']
  pull_request:
    branches: [main]

# Cancel an in-flight run of the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to the lowest supported version per go.mod (currently 1.24);
          # bump this whenever go.mod's `go` directive moves up.
          go-version: '1.24'
          cache: true

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Check gofmt
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))" \
            || (gofmt -d $(git ls-files '*.go'); exit 1)

      - name: Run go vet
        run: go vet ./...

      - name: Run race-enabled tests with coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          only-new-issues: true

      # Coverage upload is opt-in: until the project is enabled on
      # codecov.io, this step silently no-ops (fail_ci_if_error: false).
      # Remove that flag once Codecov is wired up to fail on regressions.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          flags: unittests
          fail_ci_if_error: false
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
